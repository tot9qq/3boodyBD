    <style>
        :root {
            --card-bg: rgba(15, 23, 42, 0.45);
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background:
                url("ab2.jpg.jpeg")
                no-repeat center center fixed;

            background-size: auto;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(10, 25, 47, 0.55);
            z-index: 1;
        }

        button,
        .screen,
        .modal {
            z-index: 10;
        }

        /* =========================
           زر الموسيقى
        ========================== */

        .music-control {
            position: fixed;
            top: 20px;
            left: 20px;

            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);

            padding: 9px 14px;
            border-radius: 20px;

            cursor: pointer;
            z-index: 2000;

            font-size: 14px;

            display: flex;
            align-items: center;
            gap: 6px;

            backdrop-filter: blur(5px);
        }

        /* =========================
           الشاشات
        ========================== */

        .screen {
            position: absolute;

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            transition:
                opacity 0.8s ease,
                transform 0.8s ease;

            opacity: 0;
            pointer-events: none;

            transform: scale(0.95);

            padding: 20px;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        /* =========================
           الهدية
        ========================== */

        .gift-box-container {
            text-align: center;
            cursor: pointer;
            animation: bounce 2s infinite;
        }

        .gift-icon-wrapper {
            position: relative;

            width: 210px;
            height: 200px;

            display: flex;
            flex-direction: column;
            align-items: center;

            filter:
                drop-shadow(0 15px 25px rgba(0, 0, 0, 0.5));
        }

        .gift-bow-svg {
            width: 130px;
            height: 60px;

            background: #60a5fa;

            clip-path:
                polygon(
                    50% 100%,
                    0% 20%,
                    20% 0%,
                    50% 50%,
                    80% 0%,
                    100% 20%
                );

            position: absolute;
            top: -15px;

            z-index: 10;

            border-radius: 50% 50% 0 0;
        }

        .gift-lid {
            width: 220px;
            height: 45px;

            background: #0033aa;

            border-radius: 8px 8px 4px 4px;

            position: relative;
            z-index: 5;

            box-shadow:
                0 4px 6px rgba(0, 0, 0, 0.15);
        }

        .gift-body {
            width: 190px;
            height: 130px;

            background: #0022cc;

            border-radius: 0 0 16px 16px;

            position: relative;
            overflow: hidden;

            margin-top: -2px;
        }

        .gift-vertical-stripe {
            position: absolute;

            top: 0;
            bottom: 0;
            left: 50%;

            transform: translateX(-50%);

            width: 38px;

            background: #60a5fa;
        }

        .gift-horizontal-stripe {
            position: absolute;

            top: 35px;
            left: 0;
            right: 0;

            height: 25px;

            background: #001588;

            z-index: 2;
        }

        .gift-info {
            margin-top: 25px;
            text-align: center;
        }

        .gift-info h3 {
            font-size: 14px;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        .gift-info h1 {
            font-size: 28px;
            color: var(--accent-color);

            margin: 5px 0;

            text-shadow:
                0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .gift-info p {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* =========================
           الأزرار
        ========================== */

        .btn-custom {
            margin-top: 15px;

            padding: 10px 25px;

            background:
                linear-gradient(
                    135deg,
                    #0284c7,
                    #38bdf8
                );

            border: none;
            border-radius: 30px;

            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 5px 15px rgba(56, 189, 248, 0.4);

            transition: 0.3s;
        }

        .btn-custom:hover {
            transform: scale(1.05);

            box-shadow:
                0 8px 20px rgba(56, 189, 248, 0.6);
        }

        /* =========================
           الكعكة
        ========================== */

        .cake-container {
            text-align: center;
        }

        .cake {
            font-size: 80px;

            margin-bottom: 20px;

            position: relative;

            cursor: pointer;
        }

        .flame {
            font-size: 30px;

            position: absolute;

            top: -25px;
            left: 50%;

            transform: translateX(-50%);

            animation:
                flicker 0.5s infinite alternate;
        }

        .flame.extinguished {
            display: none;
        }

        /* =========================
           البطاقات
        ========================== */

        .card-slider-wrapper {
            display: flex;

            align-items: center;

            max-width: 480px;
            width: 100%;

            position: relative;
        }

        .card-container {
            background: var(--card-bg);

            border:
                1px solid rgba(56, 189, 248, 0.4);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            padding: 25px;

            border-radius: 20px;

            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.4);

            width: 100%;

            text-align: center;

            min-height: 330px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            margin-bottom: 10px;

            font-size: 20px;

            font-weight: bold;

            color: var(--accent-color);
        }

        .card-body {
            font-size: 16px;

            line-height: 1.6;

            color: var(--text-color);

            flex-grow: 1;

            display: flex;

            align-items: center;
            justify-content: center;

            text-shadow:
                0 1px 2px rgba(0, 0, 0, 0.6);
        }

        .memory-image {
    width: 100%;
    height: auto;
    max-height: 300px;

    object-fit: contain;

    border-radius: 20px;

    border:
        2px solid rgba(56, 189, 248, 0.5);

    display: block;

    box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.5);
}

        .memory-caption {
            margin-top: 12px;
            color: white;
            font-size: 15px;
        }

        .side-dots {
            display: flex;

            flex-direction: column;

            gap: 10px;

            margin-right: 15px;
        }

        .dot {
            width: 12px;
            height: 12px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.4);

            cursor: pointer;

            transition: 0.3s;
        }

        .dot.active {
            background:
                var(--accent-color);

            transform: scale(1.3);
        }

        /* =========================
           النافذة المنبثقة
        ========================== */

        .modal {
            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, 0.75);

            backdrop-filter: blur(5px);

            display: flex;

            justify-content: center;
            align-items: center;

            opacity: 0;

            pointer-events: none;

            transition: 0.3s;

            z-index: 3000;

            padding: 20px;
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background:
                rgba(15, 23, 42, 0.95);

            border:
                1px solid var(--accent-color);

            padding: 30px;

            border-radius: 20px;

            max-width: 500px;

            width: 100%;

            max-height: 80vh;

            overflow-y: auto;

            position: relative;

            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.6);
        }

        .close-modal {
            position: absolute;

            top: 15px;
            left: 15px;

            background: none;

            border: none;

            color: white;

            font-size: 22px;

            cursor: pointer;
        }

        /* =========================
           الحركات
        ========================== */

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes flicker {
            0% {
                opacity: 1;
                transform:
                    translateX(-50%) scale(1);
            }

            100% {
                opacity: 0.6;
                transform:
                    translateX(-50%) scale(0.9);
            }
        }

        /* =========================
           تحسين الهاتف
        ========================== */

        @media (max-width: 600px) {

                top: 10px;
                left: 10px;
                font-size: 12px;
                padding: 7px 10px;
            }

            .gift-icon-wrapper {
                transform: scale(0.85);
            }

            .gift-info h1 {

            }

            }

            .card-container {

                padding: 20px;
            }

            .card-header {
                font-size: 20px;
            }

            .card-body {
                font-size: 20px;
            }

            .memory-image {
    width: 100%;
    height: auto;
    max-height: 300px;

        2px solid rgba(56, 189, 248, 0.5);

}

            .side-dots {
                margin-right: 8px;
                gap: 8px;
            }

            .dot {
                width: 10px;
                height: 10px;
            }
        }
    </style>
</head>

        }


        /* =========================================
           تغيير الشاشة
        ========================================== */

        function switchScreen(
            fromId,
            toId
        ) {

            document
                .getElementById(fromId)
                .classList
                .remove("active");

            document
                .getElementById(toId)
                .classList
                .add("active");

        }


        /* =========================================
           شاشة الكعكة
        ========================================== */

        function goToCakeScreen() {

            switchScreen(
                "screen-greeting",
                "screen-cake"
            );

            initMicrophone();

        }


        /* =========================================
           المايكروفون
        ========================================== */

        function initMicrophone() {

            const statusEl =
                document.getElementById(
                    "mic-status"
                );


            if (
                navigator.mediaDevices &&
                navigator.mediaDevices.getUserMedia
            ) {

                navigator.mediaDevices
                    .getUserMedia({
                        audio: true
                    })

                    .then(stream => {

                        statusEl.innerText =
                            "المايكروفون يعمل.. انفخ على الشمعة لإطفائها!";


                        const AudioContext =
                            window.AudioContext ||
                            window.webkitAudioContext;


                        if (!AudioContext) {

                            statusEl.innerText =
                                "المتصفح لا يدعم تحليل الصوت. انقر على الشمعة يدوياً!";

                            stream
                                .getTracks()
                                .forEach(
                                    track =>
                                        track.stop()
                                );

                            return;
                        }


                        const audioContext =
                            new AudioContext();


                        const analyser =
                            audioContext.createAnalyser();


                        const microphone =
                            audioContext
                                .createMediaStreamSource(
                                    stream
                                );


                        microphone.connect(
                            analyser
                        );


                        analyser.fftSize = 256;


                        const bufferLength =
                            analyser.frequencyBinCount;


                        const dataArray =
                            new Uint8Array(
                                bufferLength
                            );


                        function checkBlow() {

                            analyser
                                .getByteFrequencyData(
                                    dataArray
                                );


                            let sum = 0;


                            for (
                                let i = 0;
                                i < bufferLength;
                                i++
                            ) {

                                sum +=
                                    dataArray[i];

                            }


                            const average =
                                sum /
                                bufferLength;


                            if (
                                average > 45
                            ) {

                                extinguishCandle();

                                stream
                                    .getTracks()
                                    .forEach(
                                        track =>
                                            track.stop()
                                    );

                                audioContext.close();

                                return;

                            }


                            requestAnimationFrame(
                                checkBlow
                            );

                        }


                        checkBlow();

                    })

                    .catch(error => {

                        console.error(
                            "Microphone error:",
                            error
                        );

                        statusEl.innerText =
                            "تعذر الوصول للمايكروفون، انقر على الشمعة يدوياً لإطفائها!";

                    });

            }

            else {

                statusEl.innerText =
                    "المتصفح لا يدعم المايكروفون، انقر على الشمعة يدوياً!";

            }

        }


        /* =========================================
           إطفاء الشمعة
        ========================================== */

        function blowCandleManually() {

            extinguishCandle();

        }


        function extinguishCandle() {

            const flame =
                document.getElementById(
                    "candle-flame"
                );


            if (
                flame.classList.contains(
                    "extinguished"
                )
            ) {
                return;
            }


            flame.classList.add(
                "extinguished"
            );


            document.getElementById(
                "mic-status"
            ).innerText =
                "رائع! تم إطفاء الشمعة بنجاح 🎉";


            setTimeout(
                () => {

                    goToMainContent();

                },
                1200
            );

        }


        /* =========================================
           الدخول للمحتوى
        ========================================== */

        function goToMainContent() {

            switchScreen(
                "screen-cake",
                "screen-main"
            );

            updateCardContent();

        }


        /* =========================================
           البطاقات
        ========================================== */

        function setCard(index) {

            currentCardIndex =
                index;

            updateCardContent();

        }


        function updateCardContent() {

            const card =
                cardsData[
                    currentCardIndex
                ];


            document.getElementById(
                "card-icon"
            ).innerText =
                card.icon;


            document.getElementById(
                "card-title"
            ).innerText =
                card.title;


            document.getElementById(
                "card-text"
            ).innerHTML =
                card.text;


            const extraBtn =
                document.getElementById(
                    "extra-btn"
                );


            if (
                card.showButton
            ) {

                extraBtn.style.display =
                    "inline-block";

            }

            else {

                extraBtn.style.display =
                    "none";

            }


            const dots =
                document.querySelectorAll(
                    ".dot"
                );


            dots.forEach(
                (dot, idx) => {

                    if (
                        idx ===
                        currentCardIndex
                    ) {

                        dot.classList.add(
                            "active"
                        );

                    }

                    else {

                        dot.classList.remove(
                            "active"
                        );

                    }

                }
            );

        }


        /* =========================================
           النافذة المنبثقة
        ========================================== */

        function openModal() {

            const card =
                cardsData[
                    currentCardIndex
                ];


            document.getElementById(
                "modal-title"
            ).innerText =
                card.title;


            document.getElementById(
                "full-message-text"
            ).innerText =
                card.modalText ||
                card.text;


            document.getElementById(
                "message-modal"
            ).classList.add(
                "open"
            );

        }


        function closeModal() {

            document.getElementById(
                "message-modal"
            ).classList.remove(
                "open"
            );

        }


        /* =========================================
           تحميل أول بطاقة
        ========================================== */

        updateCardContent();

    </script>

</body>

</html>
